<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector extraction harness — ECG Atlas</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <div>
        <h1>ECG Atlas</h1>
        <p class="topbar__sub">Developer harness · pdf.js render vs. recovered geometry</p>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="nav__link" href="./index.html">Atlas</a>
      <a class="nav__link" href="./quiz.html">Test yourself</a>
      <a class="nav__link" href="./ptbxl.html">Serial pairs</a>
      <a class="nav__link" href="./compare.html">Compare</a>
    </nav>
  </header>

  <main class="dev">
    <div class="dev__controls">
      <label for="fixture">Fixture</label>
      <select id="fixture">
        <option value="serial-a-baseline">serial-a-baseline (68 bpm)</option>
        <option value="serial-b-followup">serial-b-followup (82 bpm, ST+ V2-V4)</option>
        <option value="calib-50mms-5mmmv">calib-50mms-5mmmv (50 mm/s, 5 mm/mV)</option>
        <option value="noisy-wander">noisy-wander</option>
      </select>
      <button type="button" class="btn" id="run">Run extraction</button>
      <span id="timing" class="statusbar__item"></span>
    </div>

    <div class="dev__grid">
      <div class="panel">
        <h3 class="panel__title">pdf.js raster render (reference)</h3>
        <canvas id="render"></canvas>
      </div>
      <div class="panel">
        <h3 class="panel__title">Recovered polylines (classified)</h3>
        <canvas id="recovered"></canvas>
      </div>
    </div>

    <div class="panel">
      <h3 class="panel__title">Extraction report</h3>
      <pre id="report">Choose a fixture and press Run.</pre>
    </div>
  </main>

  <script type="module" src="./src/dev.ts"></script>
</body>
</html>
