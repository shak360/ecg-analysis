<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector extraction harness — Serial ECG</title>
  <link rel="stylesheet" href="./styles/app.css">
  <style>
    .dev { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
    .dev__controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .dev__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 1100px) { .dev__grid { grid-template-columns: 1fr; } }
    .dev__card {
      background: var(--bg-raised); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; min-width: 0;
    }
    .dev__card h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-muted); margin-bottom: 8px;
    }
    canvas { width: 100%; height: auto; background: #fff; border: 1px solid var(--border); }
    pre {
      font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
      white-space: pre-wrap; margin: 0; color: var(--text-muted);
      max-height: 320px; overflow: auto;
    }
    select, .dev__controls .btn { font: inherit; font-size: 13px; }
    select {
      padding: 6px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-raised); color: var(--text);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <div>
        <h1>Vector extraction harness</h1>
        <p class="topbar__sub">pdf.js render vs. recovered geometry</p>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="nav__link" href="./index.html">Compare</a>
      <a class="nav__link" href="./atlas.html">Atlas</a>
      <a class="nav__link" href="./ptbxl.html">Serial pairs</a>
      <a class="nav__link" href="./try.html">Single strip</a>
      <a class="nav__link nav__link--current" href="./dev.html" aria-current="page">Extraction</a>
    </nav>
  </header>

  <main class="dev">
    <div class="dev__controls">
      <label for="fixture">Fixture</label>
      <select id="fixture">
        <option value="serial-a-baseline">serial-a-baseline (68 bpm)</option>
        <option value="serial-b-followup">serial-b-followup (82 bpm, ST+ V2-V4)</option>
        <option value="calib-50mms-5mmmv">calib-50mms-5mmmv (50 mm/s, 5 mm/mV)</option>
        <option value="noisy-wander">noisy-wander</option>
      </select>
      <button type="button" class="btn" id="run">Run extraction</button>
      <span id="timing" class="statusbar__item"></span>
    </div>

    <div class="dev__grid">
      <div class="dev__card">
        <h3>pdf.js raster render (reference)</h3>
        <canvas id="render"></canvas>
      </div>
      <div class="dev__card">
        <h3>Recovered polylines (classified)</h3>
        <canvas id="recovered"></canvas>
      </div>
    </div>

    <div class="dev__card">
      <h3>Extraction report</h3>
      <pre id="report">Choose a fixture and press Run.</pre>
    </div>
  </main>

  <script type="module" src="./src/dev.ts"></script>
</body>
</html>
