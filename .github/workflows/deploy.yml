# Publish the site to GitHub Pages.
#
# Separate from `ci.yml` because it fails for a different reason than the tests
# do — almost always PhysioNet being slow or down, which says nothing about the
# code — and because it must not run on every branch.
#
# Three things this job has to know:
#
#   1. **The corpus is not in the repository.** `data/` is 429 MB and gitignored,
#      so CI fetches it from PhysioNet and caches it. That fetch is ~2,400 HTTP
#      requests and takes a while cold; the cache key is the fetch tools, so it
#      only happens again when the tools change. `restore-keys` means a partial
#      hit still saves most of it.
#   2. **A project page is not served from the domain root.** It lives at
#      `/<repo>/`, so `SITE_BASE` has to be set or every asset URL 404s. It comes
#      from the `configure-pages` step rather than being hardcoded, so a rename
#      or a move to a custom domain does not silently break the build.
#   3. **`npm run build` is not enough.** It builds the app but not the corpus.
#      `build:site` also runs `tools/stage-corpus.ts`, which trims each record to
#      the ten seconds the atlas displays and packs it — 429 MB of WFDB becomes
#      about 30 MB of servable files. Without that step the site deploys with an
#      empty picker.
#
# `--ignore-scripts` on install, per decision 0006.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to write; nothing else here does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway — a half-finished Pages
# upload is a broken site rather than an unchanged one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site and stage the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the Rust toolchain and wasm-pack
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - uses: Swatinem/rust-cache@v2

      - uses: actions/configure-pages@v6
        id: pages

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Keyed on the fetch tools *and on this file*, because what lands in
      # `data/` depends as much on how the tools are invoked as on the tools.
      #
      # Hashing only the tools meant a cache saved by a run with the wrong fetch
      # commands stayed valid forever: correcting the commands did not change
      # the key, so the broken corpus was restored and the fix never ran. The
      # cache outlived the mistake that made it.
      #
      # `restore-keys` is deliberately gone with it. A partial-prefix hit is
      # what silently substitutes an older corpus for the one this build asked
      # for, and re-fetching 374 MB is cheap next to publishing the wrong data.
      - name: Restore the corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: data
          key: corpus-${{ hashFiles('tools/fetch-ptbxl.ts', 'tools/fetch-challenge2021.ts', '.github/workflows/deploy.yml') }}

      # Three invocations, not two. `fetch:ptbxl` has two selection modes and
      # runs the serial-pairs one by default: without `--atlas` it fetches
      # records and writes `serial-pairs.json` but never writes `atlas.json`,
      # which is the index the atlas itself reads. They cannot be combined —
      # the tool exits after writing an index precisely so one selection cannot
      # overwrite the other's.
      #
      # Getting this wrong published a site with only the challenge corpus and a
      # green tick, because the staging step treated a missing index as "this
      # corpus was not fetched, carry on". It now fails instead, so this cannot
      # recur silently — but the ordering is still load-bearing.
      #
      # The `--atlas N` counts are explicit and match README.md rather than
      # riding on the tool's defaults, because N is what decides how large the
      # published corpus is. Leaving it implicit is how the deployed sample and
      # the documented one drift apart without either being wrong.
      #
      # `--reindex` is the third line and the reason the deployed corpus was a
      # third of the local one. The two selections barely overlap: `--atlas`
      # picks records by *statement*, the pair fetch picks them by *pair
      # structure*, and each writes only its own index. So after both have run
      # there are ~722 human-validated records sitting in `records500/` that no
      # atlas index names. `--reindex` indexes everything on disk that meets the
      # atlas standard, whichever selection fetched it. It downloads nothing —
      # the files are already there — and takes 324 PTB-XL cases to ~1,046.
      #
      # It runs last because it reads the directory, so anything fetched after
      # it would be missed.
      - name: Fetch the corpus from PhysioNet
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          npm run fetch:ptbxl -- --atlas 6
          npm run fetch:ptbxl
          npm run fetch:challenge -- --atlas 4
          npm run fetch:ptbxl -- --reindex

      - name: Build the WASM module
        run: npm run wasm

      - name: Generate the synthetic fixtures
        run: npm run fixtures

      # `stage-corpus` exits non-zero if the atlas index names a record that is
      # not on disk, which is the one failure that would otherwise deploy a
      # picker full of cases that 404 when clicked.
      - name: Build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
